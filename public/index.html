<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Киноафиша</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <h1>Киноафиша</h1>
      </header>
      <main>
        <section class="panel controls">
          <h2>Настройки афиши</h2>
          <label for="search">Поиск по названию</label
          ><input id="search" placeholder="Например, сигнал" /><label
            for="genre"
            >Жанр</label
          ><select id="genre">
            <option value="all">Все жанры</option>
            <option>Фантастика</option>
            <option>Приключения</option>
            <option>Детектив</option>
          </select>
          <div class="actions">
            <button id="load-button">Получить данные</button
            ><button class="secondary" id="clear-button">
              Показать пустой ответ
            </button>
          </div>
        </section>
        <section class="panel content">
          <h2>Киноафиша</h2>
          <div id="status" class="status" role="status">
            Ожидается загрузка JSON.
          </div>
          <div id="summary" class="stats">Фильмы не загружены</div>
          <div id="movie-list" class="list">
            <div class="empty">Здесь будут карточки фильмов</div>
          </div>
        </section>
      </main>
      <footer class="page-foot"></footer>
    </div>
  </body>
</html>
